apiVersion: apps/v1
kind: Deployment
metadata:
  name: official-website
  labels:
    app: official-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: official-website
  template:
    metadata:
      labels:
        app: official-website
    spec:
      containers:
        - name: official-website
          image: <server-ip>:5000/official-website:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: official-website-nginx-config
