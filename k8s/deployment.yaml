apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezbuild-website
  namespace: ezbuild
  labels:
    app: ezbuild-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ezbuild-website
  template:
    metadata:
      labels:
        app: ezbuild-website
    spec:
      imagePullSecrets:
        - name: tcr-secret
      containers:
        - name: ezbuild-website
          image: ezbuild-images.tencentcloudcr.com/ezbuild/ezbuild:website-20261021-113718@sha256:98fb82af26c41d615f1a3e7ccfb1fee5da087aa9c28458fae51ec786e3430ccd
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: ezbuild-website-nginx-config
